<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>像素小账本</title><style>*{box-sizing:border-box}body{margin:0;background:#fff1f7;color:#4b3450;font-family:monospace}main{max-width:440px;margin:auto;padding:16px}.title{text-align:center;color:#f05b91;text-shadow:2px 2px #ffd3e3;font-size:26px}.sub{text-align:center;color:#9d7598}.card{background:#fff;border:3px solid #f6a3c1;box-shadow:4px 4px #d88ba9;border-radius:10px;padding:14px;margin:14px 0}.summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}.summary b{display:block;font-size:18px;margin-top:8px}.income{color:#43a978}.expense{color:#eb5e7e}.balance{color:#7d68c7}label{display:block;margin:8px 0 4px}input,select,button{width:100%;padding:11px;border:2px solid #f1a2bd;border-radius:6px;background:#fffafc;font:inherit;color:inherit}button{background:#ff82aa;color:#fff;font-weight:bold;cursor:pointer;margin-top:12px}.tabs{display:flex;gap:8px}.tabs button{margin:0;background:#ffd6e5;color:#a94974}.tabs .on{background:#f36b99;color:#fff}.item{display:flex;align-items:center;justify-content:space-between;border-bottom:2px dashed #f5c4d5;padding:10px 0}.item small{color:#a98aa5}.del{width:auto;margin:0;padding:5px 8px;background:#ffe1ea;color:#c95d7c;border:0}.empty{text-align:center;color:#b895af;padding:20px}</style></head><body><main><h1 class="title">♡ 像素小账本 ♡</h1><p class="sub">把每一笔小心意记下来</p><section class="card summary"><div class="income">收入<b id="income">¥0.00</b></div><div class="expense">支出<b id="expense">¥0.00</b></div><div class="balance">余额<b id="balance">¥0.00</b></div></section><section class="card"><div class="tabs"><button class="on" id="outTab">记支出</button><button id="inTab">记收入</button></div><label>金额</label><input id="amount" type="number" min="0" step="0.01" placeholder="例如 12.50"><label>分类</label><select id="category"><option>餐饮</option><option>交通</option><option>购物</option><option>学习</option><option>娱乐</option><option>其他</option></select><label>备注</label><input id="note" placeholder="买了什么？"><button id="add">＋ 保存这笔账</button></section><section class="card"><h2>账单记录</h2><div id="list"></div></section></main><script>const $=id=>document.getElementById(id);let type='out',data=JSON.parse(localStorage.pixelLedger||'[]');function money(n){return '¥'+n.toFixed(2)}function render(){let inc=data.filter(x=>x.type==='in').reduce((a,x)=>a+x.amount,0),out=data.filter(x=>x.type==='out').reduce((a,x)=>a+x.amount,0);$('income').textContent=money(inc);$('expense').textContent=money(out);$('balance').textContent=money(inc-out);$('list').innerHTML=data.length?data.slice().reverse().map((x,i)=>'<div class="item"><span>'+ (x.type==='in'?'💚':'💗')+' '+x.category+'<br><small>'+x.note+' · '+x.date+'</small></span><span>'+ (x.type==='in'?'+':'-')+money(x.amount)+' <button class="del" data-i="'+i+'">删除</button></span></div>').join(''):'<div class="empty">还没有账单，记下第一笔吧 ♡</div>';document.querySelectorAll('.del').forEach(b=>b.onclick=()=>{data.splice(data.length-1-Number(b.dataset.i),1);save()})}function save(){localStorage.pixelLedger=JSON.stringify(data);render()}$('outTab').onclick=()=>{type='out';$('outTab').classList.add('on');$('inTab').classList.remove('on')};$('inTab').onclick=()=>{type='in';$('inTab').classList.add('on');$('outTab').classList.remove('on')};$('add').onclick=()=>{let amount=Number($('amount').value);if(!amount)return alert('请先填写金额');data.push({type,amount,category:$('category').value,note:$('note').value||'未填写备注',date:new Date().toLocaleDateString()});$('amount').value='';$('note').value='';save()};render()</script></body></html>
