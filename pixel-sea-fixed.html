<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Sea</title><style>body{margin:0;background:#071a35;color:white;text-align:center;font:16px monospace}main{max-width:420px;margin:auto;padding:12px}h1{color:#ffe477}canvas{width:100%;border:4px solid #74def8;image-rendering:pixelated}.hud{display:flex;justify-content:space-around;border:3px solid #74def8;padding:8px}.cover{position:absolute;inset:0;display:grid;place-items:center;background:#04162ddd}.box{position:relative}.cover button,button{font:inherit;font-weight:bold;padding:12px;background:#ffe477;border:3px solid white}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:220px;margin:14px auto}.keys button{background:#15547a;color:white;border-color:#74def8;height:48px}.blank{visibility:hidden}</style></head><body><main><h1>PIXEL SEA</h1><p>Move fish. Collect pearls. Avoid jellyfish.</p><div class="hud"><span>Score <b id="score">0</b></span><span>Best <b id="best">0</b></span><span>Lives <b id="lives">3</b></span></div><div class="box"><canvas id="canvas" width="360" height="520"></canvas><div class="cover" id="cover"><button id="startButton">START GAME</button></div></div><div class="keys"><i class="blank"></i><button data-dir="up">UP</button><i class="blank"></i><button data-dir="left">LEFT</button><button data-dir="down">DOWN</button><button data-dir="right">RIGHT</button></div></main><script>var canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),cover=document.getElementById('cover'),startButton=document.getElementById('startButton'),scoreText=document.getElementById('score'),livesText=document.getElementById('lives'),bestText=document.getElementById('best'),player,objects,score,lives,running,keys={},last,spawn;function reset(){player={x:180,y:450};objects=[];score=0;lives=3;updateText()}function updateText(){scoreText.textContent=score;livesText.textContent=lives;var best=Math.max(Number(bestText.textContent)||0,score);bestText.textContent=best;localStorage.setItem('pixelBest',best)}function draw(){ctx.fillStyle='#063b5b';ctx.fillRect(0,0,360,520);for(var i=0;i<20;i++){ctx.fillStyle='#63d9e766';ctx.fillRect((i*67)%360,(i*47)%520,3,3)}ctx.fillStyle='#24c6df';ctx.fillRect(player.x-16,player.y-10,30,20);ctx.fillRect(player.x+10,player.y-6,12,12);ctx.fillStyle='#168ba9';ctx.fillRect(player.x-23,player.y-14,8,28);ctx.fillStyle='white';ctx.fillRect(player.x+15,player.y-7,4,4);objects.forEach(function(o){ctx.fillStyle=o.bad?'#e66bb8':'#fff0a8';ctx.fillRect(o.x-7,o.y-7,14,14)})}function frame(time){if(!running)return;var delta=Math.min(32,time-last);last=time;if(keys.left)player.x-=delta*.35;if(keys.right)player.x+=delta*.35;if(keys.up)player.y-=delta*.35;if(keys.down)player.y+=delta*.35;player.x=Math.max(22,Math.min(338,player.x));player.y=Math.max(22,Math.min(498,player.y));spawn+=delta;if(spawn>650){spawn=0;objects.push({x:20+Math.random()*320,y:-10,bad:Math.random()<.35,speed:1+Math.random()})}for(var i=objects.length-1;i>=0;i--){var o=objects[i];o.y+=o.speed*delta*.12;if(Math.abs(o.x-player.x)<22&&Math.abs(o.y-player.y)<22){objects.splice(i,1);if(o.bad){lives--;if(lives<=0){running=false;cover.style.display='grid';startButton.textContent='PLAY AGAIN'}}else score+=10;updateText()}else if(o.y>540)objects.splice(i,1)}draw();requestAnimationFrame(frame)}function startGame(){reset();running=true;cover.style.display='none';last=performance.now();spawn=0;requestAnimationFrame(frame)}startButton.addEventListener('click',startGame);document.querySelectorAll('[data-dir]').forEach(function(button){button.addEventListener('pointerdown',function(){keys[button.dataset.dir]=true});button.addEventListener('pointerup',function(){keys[button.dataset.dir]=false});button.addEventListener('pointerleave',function(){keys[button.dataset.dir]=false})});window.addEventListener('keydown',function(e){keys[e.key.replace('Arrow','').toLowerCase()]=true});window.addEventListener('keyup',function(e){keys[e.key.replace('Arrow','').toLowerCase()]=false});bestText.textContent=localStorage.getItem('pixelBest')||0;reset();draw();</script></body></html>
